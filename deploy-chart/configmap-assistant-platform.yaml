apiVersion: v1
data:
  businessconfig.yml: |
    spring:
      application:
        name: businessconfig
    operatorfabric.businessconfig:
      storage:
        path: "/businessconfig-storage"
  cards-consultation.yml: |
    spring:
      application:
        name: cards-consultation
    checkIfUserIsAlreadyConnected: true
  cards-publication.yml: |
    spring:
      application:
        name: cards-publication
      deserializer:
        value:
          delegate:
            class: io.confluent.kafka.serializers.KafkaAvroDeserializer
      serializer:
        value:
          delegate:
            class: io.confluent.kafka.serializers.KafkaAvroSerializer
    opfab:
      kafka:
        topics:
          card:
            topicname: opfab
          response-card:
            topicname: opfab-response
        schema:
          registry:
            url: http://localhost:8081
    checkAuthenticationForCardSending: false
  common.yml: |
    management:
      endpoints:
        web:
          exposure:
            include: '*'
    spring:
      rabbitmq:
        host: cab-rabbitmq.cab.svc.cluster.local
        port: 5672
        username: ${RABBITMQ_USERNAME}
        password: ${RABBITMQ_PASSWORD}
      security:
        provider-url: https://keycloak.irtsysx.fr/auth
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: ${spring.security.provider-url}/realms/interactiveai/protocol/openid-connect/certs
      data:
        mongodb:
          database: ${MONGODB_DB}
          uri: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@cab-mongodb.cab.svc.cluster.local:27017/${MONGODB_DB}?authSource=admin&authMode=scram-sha1
    server:
      forward-headers-strategy: framework
    operatorfabric:
      servicesUrls:
        users: "http://cab-users.cab.svc.cluster.local:8080"
        businessconfig: "http://cab-businessconfig.cab.svc.cluster.local:8080"
  nginx.conf: |
    # docker-compose DNS used to resolved users service
    # resolver 127.0.0.11 ipv6=off;

    # Log format to have msec in time + request processing time
    map "$time_local:$msec" $time_local_ms {
        ~(^\S+)(\s+\S+):\d+\.(\d+)$ $1.$3$2;
    }
    log_format opfab-log '$remote_addr - $time_local_ms'
    '"$request" $status $request_time $body_bytes_sent ';

    log_format upstreamlog '[$time_local] $remote_addr - $remote_user - $server_name $host to: $upstream_addr: $request $status upstream_response_time $upstream_response_time msec $msec request_time $request_time';

    server {
        listen 8080;
        server_name localhost demo.interactiveai.irt-systemx.fr;
        error_log /var/log/nginx/error.log debug;
        access_log /var/log/nginx/access.log opfab-log;

        ### CUSTOMIZATION - BEGIN
        # Url of the Authentication provider
        set $KeycloakBaseUrl "https://keycloak.irtsysx.fr";
        # Realm associated to OperatorFabric within the Authentication provider
        set $OperatorFabricRealm "interactiveai";
        # base64 encoded pair of authentication in the form of 'client-id:secret-id'
        set $ClientPairOFAuthentication "b3BmYWItY2xpZW50Oklxdkh4VzBEdENDNXVMVEVTcFhyN0sxdkhtSHViOGdE" ;

        ### CUSTOMIZATION - END

        ###  OPFAB GENERIC CONFIGURATION  ###
        ###  BE CAREFUL WHEN MODIFYING    ###
        set $BasicValue "Basic $ClientPairOFAuthentication";
        set $KeycloakOpenIdConnect $KeycloakBaseUrl/auth/realms/$OperatorFabricRealm/protocol/openid-connect;
        gzip on;
        gzip_types application/javascript text/css;

        location / {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }
        location = /external/ {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/external/;
            index index.html index.htm;
        }
        location /ui/ {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/;
            index index.html index.htm;
        }
        location /auth/check_token {
            add_header Cache-Control "no-cache";
            proxy_set_header Host keycloak.irtsysx.fr;
            proxy_set_header Authorization $BasicValue ;
            proxy_pass $KeycloakOpenIdConnect/token/introspect;
        }
        location /auth/token {
            add_header Cache-Control "no-cache";
            proxy_set_header Host keycloak.irtsysx.fr;
            proxy_set_header Authorization $BasicValue ;
            proxy_pass $KeycloakOpenIdConnect/token;
        }
        location /auth/code/ {
            add_header Cache-Control "no-cache";
            proxy_set_header Host keycloak.irtsysx.fr;
            proxy_set_header Authorization $BasicValue ;
            proxy_pass $KeycloakOpenIdConnect/auth?response_type=code&client_id=opfab-client&$args;
        }

        location /auth {
            add_header Cache-Control "no-cache";
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host keycloak.irtsysx.fr;
            proxy_pass $KeycloakBaseUrl/auth;
        }

        # To be sure new files are downloaded when version change
        # we set no-cache for json config files and for i18n files
        location /config/web-ui.json {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/opfab/web-ui.json;
        }
        location /config/ui-menu.json {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/opfab/ui-menu.json;
        }
        location /ui/assets/i18n/ {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/assets/i18n/;
        }

        location /businessconfig {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-businessconfig.cab.svc.cluster.local:8080;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ~ "^/users/internal/(.*)" {
            return 404;
        }

        location ~ "^/users/(.*)" {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-users.cab.svc.cluster.local:8080/$1$is_args$args;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /users {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-users.cab.svc.cluster.local:8080/users;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /perimeters {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-users.cab.svc.cluster.local:8080/perimeters;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /cards/ {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cardsconsultation.cab.svc.cluster.local:8080/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        ###  !!!! SECURITY WARNING !!!!
        ### The following configuration is suitable only if you set checkAuthenticationForCardSending to true
        ### which is the default configuration
        ###

        location /cardspub/cards {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cardspublication.cab.svc.cluster.local:8080/cards;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        ### if you set checkAuthenticationForCardSending to false
        ### you MUST not permit to access cards endpoint via nginx
        ### and replace the previous configuration by the following conf

        #location /cardspub/cards/user {
        #  proxy_pass http://cards-publication:8080/cards/user;
        #  proxy_set_header X-Forwarded-For $remote_addr;
        #}
        #location /cardspub/cards/translateCardField {
        #  proxy_pass http://cards-publication:8080/cards/translateCardField;
        #  proxy_set_header X-Forwarded-For $remote_addr;
        #}
        ###
        ### !!! END SECURITY WARNING  !!!
        location /archives {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cardsconsultation.cab.svc.cluster.local:8080;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /externaldevices {
            add_header Cache-Control "no-cache";
            set $externaldevices http://external-devices.cab.svc.cluster.local:8080;
            proxy_pass $externaldevices;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location ~ "^/externaldevices/(.*)" {
            add_header Cache-Control "no-cache";
            set $externaldevices http://external-devices.cab.svc.cluster.local:8080;
            proxy_pass $externaldevices/$1;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /cabcontext/ {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cabcontext.cab.svc.cluster.local:5000/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /cab_event/ {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cabevent.cab.svc.cluster.local:5000/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /cab_recommendation/ {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cabrecommendation.cab.svc.cluster.local:5000/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /cabhistoric/ {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cabhistoric.cab.svc.cluster.local:5000/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /cab_capitalization/ {
            add_header Cache-Control "no-cache";
            proxy_pass http://cab-cabcapitalization.cab.svc.cluster.local:5000/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # PowerGrid (grid2op) simulator "apply action" proxy. Keeps the browser POST
        # same-origin (no CORS) — the frontend is built with
        # VITE_POWERGRID_SIMU=/powergrid-simu and posts to /powergrid-simu/api/v1/recommendations.
        # __POWERGRID_SIMU_UPSTREAM__ is substituted at container start by start-webui.sh
        # from the POWERGRID_SIMU_UPSTREAM env var of the frontend pod.
        # No explicit Host header: nginx defaults it to $proxy_host (the authority from
        # proxy_pass), so the passerelle gets the right vhost whatever the upstream is.
        # Forwarding $http_host instead would make it route to the wrong vhost.
        location /powergrid-simu/ {
            add_header Cache-Control "no-cache";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            proxy_pass __POWERGRID_SIMU_UPSTREAM__;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
        location /cognitive-api/ {
        add_header Cache-Control "no-cache";
        proxy_set_header Host wesenss.inesctec.pt;
        proxy_set_header X-Fordwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_pass https://wesenss.inesctec.pt/api/v1/;
        }
    }
