<div class="map-zoom-container" (wheel)="onWheel($event)" style="padding-left: 12px; padding-top: 8px; position: relative;">
  @if (mapLoading) {
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10;border-radius:4px;">
      <span style="color:#fff;font-size:13px;font-weight:600;">⟳ Karte wird geladen...</span>
    </div>
  }
  <div [style.transform]="'scale(' + zoomLevel + ')'" [style.transform-origin]="zoomOrigin" [style.display]="'inline-block'">
<div class="map">
  <div class="environment">
    @for (row of mapClasses; track $index) {
      <div class="row">
        @for (col of row; track $index) {
          <div class="cell" [class]="col.ground">

          </div>
        }
      </div>
    }
  </div>
  <div class="agents">
    @for (agent of agents; let i = $index; track $index) {
      @if (agent.position) {
        <div
          class="agent"
          [class]="rendererService.getAgentClasses(agent)"
          [style.left]="agent.position[1] * 20 + 'px'"
          [style.top]="agent.position[0] * 20 + 'px'"
          [style.filter]="'hue-rotate(' + (i / agents.length) * 360 + 'deg)'"

        ></div>
        <div
          class="agent-label"
          [style.left]="(agent.position[1] * 20 + 5) + 'px'"
          [style.top]="(agent.position[0] * 20 - 10) + 'px'"
        >{{ agentNames[i] || 'Train_' + i }}</div>
      }
    }
  </div>
  <!-- Station markers -->
  <div class="station-markers">
    @for (st of stations; let si = $index; track si) {
      <div
        class="station-marker"
        [class.station-start]="st.type === 'start'"
        [style.left]="(st.c * 20) + 'px'"
        [style.top]="(st.r * 20) + 'px'"
        [title]="st.name"
      ></div>
    }
  </div>
</div>

  </div>
</div>
