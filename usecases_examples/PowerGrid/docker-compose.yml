services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: powergrid-simulator-app
    container_name: PowerGrid-simulator-app
    restart: always
    ports:
      - "5100:5000"
    volumes:
      - .:/code
    # the simulator runs in Docker but must reach the InteractiveAI backend on
    # the host (port 3200). `localhost` inside the container is the container
    # itself, so this maps host.docker.internal -> the host gateway on Linux.
    # Used by config/API_POWERGRID_CAB.toml (cab_server_url_0).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: powergrid-simulator-api
    container_name: PowerGrid-simulator-api
    restart: always
    ports:
      - "5100:5000"
    volumes:
      - .:/code
